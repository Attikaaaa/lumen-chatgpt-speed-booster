<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; }
  article[data-testid^="conversation-turn"] { max-width: 768px; margin: 0 auto 24px; padding: 16px 20px; }
  .turn-inner { border-radius: 12px; padding: 4px 0; }
  .turn-role { font-weight: 600; font-size: 13px; margin-bottom: 8px; opacity: .6; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
  code { font: 13px/1.5 Consolas, monospace; }
  ul { margin: 8px 0 8px 22px; }
  .animated { transition: opacity .15s; }
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  const N = 1000;
  const KEEP = 10;
  const results = {};

  /* Mirrors v3.1 CORE_CSS (src/content/content.js) — the always-on core
     rendering layer, applied whenever Lumen is enabled. */
  const STYLE_CORE =
    'article[data-testid^="conversation-turn"]{content-visibility:auto;contain-intrinsic-size:auto 140px;contain:layout style}' +
    'html{scroll-behavior:auto!important}';

  /* Mirrors v3.1 VISUAL_CSS — the optional "disable animations" toggle,
     measured separately so it never mixes into the core result. */
  const STYLE_ANIMATIONS_OFF =
    '*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:none!important}';

  /* Builds one ChatGPT-like conversation turn (role + rich markdown-ish body),
     wrapped 4 levels deep like the real app's container hierarchy. */
  function turnHTML(i) {
    let body = '';
    body += '<p>This paragraph explains the reasoning in detail with <strong>markdown</strong> and <code>inline code</code>, referencing step ' + i + '. '.repeat(8) + '</p>';
    body += '<p>A second supporting paragraph walks through the edge cases, caveats and assumptions that apply to step ' + i + ' of the conversation. '.repeat(5) + '</p>';
    body += '<ul><li>Point one with enough words to add real weight to the rendered list</li><li>Point two follows here with more detail</li><li>Point three closes the set</li><li>Point four adds the remaining context</li></ul>';
    for (let b = 0; b < 2; b++) {
      let code = '';
      for (let l = 0; l < 20; l++) code += '  const value' + b + '_' + l + ' = computeStep(' + l + ', ' + i + ');\n';
      body += '<pre><code>function example' + b + '_' + i + '(input) {\n' + code + '  return combine(values);\n}</code></pre>';
    }
    body += '<p>Closing summary sentence with final thoughts. '.repeat(4) + '</p>';
    return '<article data-testid="conversation-turn-' + i + '"><div><div><div><div class="turn-inner">' +
      '<div class="turn-role">' + (i % 2 ? 'ChatGPT' : 'You') + '</div>' + body +
      '</div></div></div></div></article>';
  }

  function buildAll() {
    const app = document.getElementById('app');
    app.textContent = '';
    const parts = new Array(N);
    for (let i = 0; i < N; i++) parts[i] = turnHTML(i);
    app.innerHTML = parts.join('');
    /* One forced layout over the whole tree = realistic "conversation loaded" cost */
    const t0 = performance.now();
    void document.documentElement.offsetHeight;
    results.layoutMs = +(performance.now() - t0).toFixed(1);
    results.nodes = document.getElementsByTagName('*').length;
  }

  /* Scroll benchmark: 40 jumps, each followed by a forced style+layout pass */
  function benchScroll() {
    const doc = document.documentElement;
    doc.scrollTop = 0;
    const steps = 40, stepPx = 1200;
    const samples = [];
    for (let s = 1; s <= steps; s++) {
      const t0 = performance.now();
      window.scrollTo(0, s * stepPx);
      void doc.offsetHeight; /* forced reflow, as after every scroll frame */
      samples.push(performance.now() - t0);
    }
    doc.scrollTop = 0;
    const sorted = samples.sort((a, b) => a - b);
    return {
      avgMs: +(samples.reduce((a, b) => a + b, 0) / steps).toFixed(2),
      p50: +sorted[Math.floor(steps / 2)].toFixed(2),
      p90: +sorted[Math.floor(steps * 0.9)].toFixed(2)
    };
  }

  /* Style+layout recalc proxy: runs on every UI update / streaming frame */
  function benchReflow() {
    const samples = [];
    for (let i = 0; i < 20; i++) {
      const t0 = performance.now();
      document.body.className = 'w' + i;
      void document.documentElement.offsetHeight;
      samples.push(performance.now() - t0);
    }
    return +(samples.reduce((a, b) => a + b, 0).toFixed(2) / 20).toFixed(2);
  }

  function addStyle(css) {
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
    return style;
  }

  function run() {
    /* ── Phase A: WITHOUT extension — plain DOM, all turns rendered ── */
    buildAll();
    results.noExt = { scroll: benchScroll(), reflowMs: benchReflow() };

    /* ── Phase B: v3.1 CORE layer only (turn virtualization CSS) ── */
    addStyle(STYLE_CORE);
    buildAll();
    results.core = { scroll: benchScroll(), reflowMs: benchReflow() };

    /* ── Phase C: core + DOM limiter (default: last 10 participating) ── */
    buildAll();
    const turns = document.querySelectorAll('article[data-testid^="conversation-turn"]');
    const t0 = performance.now();
    for (let i = 0; i < turns.length; i++) {
      if (i < turns.length - KEEP) turns[i].style.display = 'none';
    }
    void document.documentElement.offsetHeight;
    results.coreLimiter = {
      limiterMs: +(performance.now() - t0).toFixed(2),
      scroll: benchScroll(),
      reflowMs: benchReflow(),
      participatingHeightPx: document.documentElement.scrollHeight
    };

    /* ── Phase D (optional toggle): core + animations-off, limiter on ── */
    addStyle(STYLE_ANIMATIONS_OFF);
    results.animationsOff = { scroll: benchScroll(), reflowMs: benchReflow() };

    console.log('LUMEN_DOM ' + JSON.stringify(results));
    document.title = 'DONE';
  }

  window.addEventListener('load', () => setTimeout(run, 30));
})();
</script>
</body>
</html>
