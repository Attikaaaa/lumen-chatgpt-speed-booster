<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Main view -->
  <div id="mainView" class="view">

    <header class="lx-header">
      <div class="lx-brand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2l1.8 5.6L19 9.4l-4.2 3.6L16 19l-4-3.2L8 19l1.2-6L5 9.4l5.2-1.8L12 2z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="lx-name">Lumen</span>
      </div>
      <div class="lx-chip" id="statusChip">
        <span class="lx-dot"></span>
        <span id="statusText"></span>
      </div>
    </header>

    <section class="lx-stats">
      <div class="lx-stat">
        <span class="lx-stat-value" id="renderedCount">—</span>
        <span class="lx-stat-label" data-i18n="renderedLabel"></span>
      </div>
      <div class="lx-stat">
        <span class="lx-stat-value" id="totalCount">—</span>
        <span class="lx-stat-label" data-i18n="totalLabel"></span>
      </div>
      <div class="lx-stat">
        <span class="lx-stat-value lx-accent" id="memorySaved">—</span>
        <span class="lx-stat-label" data-i18n="memorySavedLabel"></span>
      </div>
    </section>
    <div class="lx-bar"><div class="lx-bar-fill" id="progressFill"></div></div>

    <section class="lx-section">
      <div class="lx-row">
        <span class="lx-label" data-i18n="perfLabel"></span>
        <label class="lx-switch">
          <input type="checkbox" id="enabled">
          <span class="lx-track"></span>
        </label>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="profileLabel"></span>
        <select id="profile" class="lx-select">
          <option value="auto">Auto</option>
          <option value="fast">Fast</option>
          <option value="balanced">Balanced</option>
          <option value="extreme">Extreme</option>
          <option value="native">Native</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="keepLastLabel"></span>
        <div class="lx-stepper">
          <button id="limitDec" aria-label="−">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <input id="limitDisplay" type="number" min="2" max="200" value="10">
          <button id="limitInc" aria-label="+">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5v7M1.5 5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="featInstantScroll"></span>
        <label class="lx-switch">
          <input type="checkbox" id="instantScroll">
          <span class="lx-track"></span>
        </label>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="featSidebarOpt"></span>
        <label class="lx-switch">
          <input type="checkbox" id="sidebarOptimization">
          <span class="lx-track"></span>
        </label>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="featNoAnimations"></span>
        <label class="lx-switch">
          <input type="checkbox" id="disableAnimations">
          <span class="lx-track"></span>
        </label>
      </div>
      <div class="lx-row">
        <span class="lx-label" data-i18n="featBlockTrackers"></span>
        <label class="lx-switch">
          <input type="checkbox" id="telemetryBlock">
          <span class="lx-track"></span>
        </label>
      </div>
    </section>

    <footer class="lx-actions">
      <button id="optimizeNow" class="lx-primary" data-i18n="optimizeNow"></button>
      <button id="reloadPage" class="lx-icon" aria-label="Reload">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>

  </div>

  <!-- Blocked view -->
  <div id="blockedView" class="view hidden">
    <div class="lx-blocked">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="var(--line-strong)" stroke-width="1.5"/>
        <path d="M6 18L18 6" stroke="var(--line-strong)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="lx-blocked-title" data-i18n="notOnChatGPT"></p>
      <p class="lx-blocked-sub" data-i18n="notOnChatGPTSub"></p>
    </div>
  </div>

  <script>
window.__lumenApi = {
  i18n: { getMessage: (k, subs) => {
    const M = {
      renderedLabel: 'In view', totalLabel: 'Total', memorySavedLabel: 'Hidden',
      perfLabel: 'Performance', profileLabel: 'Profile', keepLastLabel: 'Keep last',
      featInstantScroll: 'Instant scroll', featSidebarOpt: 'Optimize sidebar',
      featNoAnimations: 'Disable animations', featBlockTrackers: 'Block trackers',
      optimizeNow: 'Optimize', reloadPage: 'Reload page',
      notOnChatGPT: 'Not a ChatGPT tab', notOnChatGPTSub: 'Open a ChatGPT conversation to use Lumen.',
      statusActive: 'Active', statusPaused: 'Paused'
    };
    let s = (M[k] || '') + '';
    if (subs) subs.forEach((v, i) => { s = s.replace('$' + (i + 1), v); });
    return s;
  }},
  storage: { sync: { get: async d => d, set: async () => {} } },
  tabs: {
    query: async () => [{ id: 1, url: 'https://chatgpt.com/' }],
    sendMessage: async () => ({ ok: true, renderedMessages: 12, totalMessages: 482, hasOlderMessages: true }),
    reload: async () => {}
  }
};
</script>
<script>
/**
 * Lumen — ChatGPT Speed Booster · popup controller.
 *
 * Reads the active tab, renders live statistics from the content script and
 * wires the controls: master performance toggle, performance profile
 * (auto/fast/balanced/extreme/native/custom), custom message limit,
 * optimize/reload actions. All texts come from window.__lumenApi.i18n.
 */

(() => {
  'use strict';

  /* ══ Constants ══════════════════════════════════════════════════════ */

  /** Default user settings — mirrored by the service worker. */
  const DEFAULTS = Object.freeze({
    enabled: true,
    profile: 'auto',
    customLimit: 10
  });

  /** Bounds for the custom message limit. */
  const LIMIT_MIN = 2;
  const LIMIT_MAX = 200;

  /** Settings storage. */
  const store = window.__lumenApi.storage.sync || window.__lumenApi.storage.local;

  /* ══ Helpers ════════════════════════════════════════════════════════ */

  /**
   * Resolves a localized message with optional substitutions.
   * @param {string} key
   * @param {string[]} [subs]
   * @returns {string}
   */
  function t(key, subs) {
    return window.__lumenApi.i18n.getMessage(key, subs) || key;
  }

  /** Clamps `value` into the [min, max] interval. */
  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  /**
   * Type-checks a raw settings object coming from storage.
   * @param {*} raw
   * @returns {{enabled: boolean, profile: string, customLimit: number}}
   */
  function sanitize(raw) {
    return {
      enabled: typeof raw.enabled === 'boolean' ? raw.enabled : DEFAULTS.enabled,
      profile: typeof raw.profile === 'string' && PROFILES.includes(raw.profile)
        ? raw.profile
        : DEFAULTS.profile,
      customLimit: clamp(Number(raw.customLimit) || DEFAULTS.customLimit, LIMIT_MIN, LIMIT_MAX)
    };
  }

  const PROFILES = ['auto', 'native', 'fast', 'balanced', 'extreme', 'custom'];

  /**
   * True when the URL belongs to a supported ChatGPT host.
   * @param {string} [url]
   * @returns {boolean}
   */
  function isSupportedUrl(url) {
    if (typeof url !== 'string') return false;
    try {
      const parsed = new URL(url);
      return parsed.protocol === 'https:' &&
        (parsed.hostname === 'chatgpt.com' || parsed.hostname === 'chat.openai.com');
    } catch {
      return false;
    }
  }

  /**
   * Returns the active tab of the current window.
   * @returns {Promise<window.__lumenApi.tabs.Tab | null>}
   */
  async function getActiveTab() {
    const tabs = await window.__lumenApi.tabs.query({ active: true, currentWindow: true });
    return tabs[0] || null;
  }

  /**
   * Sends a message to the content script with a short timeout guard.
   * @param {number | null} tabId
   * @param {object} message
   * @returns {Promise<object | null>}
   */
  async function sendToTab(tabId, message) {
    if (!tabId) return null;
    try {
      return await Promise.race([
        window.__lumenApi.tabs.sendMessage(tabId, message),
        new Promise(resolve => setTimeout(() => resolve(null), 900))
      ]);
    } catch {
      return null;
    }
  }

  /* ══ Renderers ══════════════════════════════════════════════════════ */

  /** Localizes every element carrying a data-i18n attribute. */
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('reloadPage').title = t('reloadPage');
  }

  /**
   * Reflects the enabled state on the status chip.
   * @param {{enabled: boolean}} settings
   */
  function renderStatusChip(settings) {
    document.getElementById('statusChip').classList.toggle('is-paused', !settings.enabled);
    document.getElementById('statusText').textContent =
      t(settings.enabled ? 'statusActive' : 'statusPaused');
  }

  /**
   * Renders live conversation statistics reported by the content script.
   * @param {object | null} status
   */
  function renderStats(status) {
    const rendered = Number(status && status.renderedMessages) || 0;
    const total = Number(status && status.totalMessages) || 0;
    const hidden = Math.max(0, total - rendered);
    const hasData = total > 0;

    document.getElementById('renderedCount').textContent = hasData ? String(rendered) : '—';
    document.getElementById('totalCount').textContent = hasData ? String(total) : '—';
    document.getElementById('memorySaved').textContent =
      hasData ? `${Math.round((hidden / total) * 100)}%` : '—';

    const visiblePct = hasData ? Math.round((rendered / total) * 100) : 0;
    document.getElementById('progressFill').style.width = hasData ? `${visiblePct}%` : '0%';
  }

  /** Syncs the custom-limit stepper with the stored value. */
  function renderCustomLimit(customLimit) {
    const display = document.getElementById('limitDisplay');
    display.value = String(customLimit);
    display.max = String(LIMIT_MAX);
  }

  /**
   * Persists settings, then refreshes chip + stats from the page.
   * @param {object} settings
   * @param {number | null} tabId
   */
  async function commitSettings(settings, tabId) {
    await store.set(settings);
    renderStatusChip(settings);
    renderStats(await sendToTab(tabId, { type: 'getStatus' }));
  }

  /* ══ View wiring ════════════════════════════════════════════════════ */

  /**
   * Attaches all control handlers for the main (ChatGPT) view.
   * @param {number | null} tabId
   */
  async function setupMainView(tabId) {
    let settings = sanitize(await store.get(DEFAULTS));
    renderStatusChip(settings);
    renderCustomLimit(settings.customLimit);
    renderStats(await sendToTab(tabId, { type: 'getStatus' }));

    /* Master performance toggle */
    const toggle = document.getElementById('enabled');
    toggle.checked = settings.enabled;
    toggle.addEventListener('change', async event => {
      settings = sanitize({ ...settings, enabled: event.target.checked });
      await store.set(settings);
      renderStatusChip(settings);
      renderStats(await sendToTab(tabId, { type: 'getStatus' }));
    });

    /* Performance profile */
    const profileSelect = document.getElementById('profile');
    profileSelect.value = settings.profile;
    profileSelect.addEventListener('change', async event => {
      settings = sanitize({ ...settings, profile: event.target.value });
      await store.set(settings);
      await commitSettings(settings, tabId);
    });

    /* Custom message limit stepper */
    document.getElementById('limitDec').addEventListener('click', async () => {
      settings = sanitize({ ...settings, customLimit: clamp(settings.customLimit - 1, LIMIT_MIN, LIMIT_MAX) });
      renderCustomLimit(settings.customLimit);
      await store.set(settings);
      await commitSettings(settings, tabId);
    });

    document.getElementById('limitInc').addEventListener('click', async () => {
      settings = sanitize({ ...settings, customLimit: clamp(settings.customLimit + 1, LIMIT_MIN, LIMIT_MAX) });
      renderCustomLimit(settings.customLimit);
      await store.set(settings);
      await commitSettings(settings, tabId);
    });

    const limitInput = document.getElementById('limitDisplay');
    limitInput.addEventListener('blur', async event => {
      const next = clamp(Number(event.target.value) || settings.customLimit, LIMIT_MIN, LIMIT_MAX);
      if (next !== settings.customLimit) {
        settings = sanitize({ ...settings, customLimit: next });
        await store.set(settings);
        await commitSettings(settings, tabId);
      }
      renderCustomLimit(settings.customLimit);
    });
    limitInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') event.target.blur();
    });

    /* Optimize now — persist, give the page a beat, then re-trim via reload */
    document.getElementById('optimizeNow').addEventListener('click', async () => {
      await store.set(settings);
      await new Promise(resolve => setTimeout(resolve, 250));
      sendToTab(tabId, { type: 'trimNow' });
      window.close();
    });

    /* Plain page reload */
    document.getElementById('reloadPage').addEventListener('click', async event => {
      event.currentTarget.disabled = true;
      if (tabId) await window.__lumenApi.tabs.reload(tabId);
      window.close();
    });
  }

  /* ══ Init ═══════════════════════════════════════════════════════════ */

  async function init() {
    applyI18n();

    const tab = await getActiveTab();
    const tabId = tab ? tab.id : null;

    if (!tab || !isSupportedUrl(tab.url)) {
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('blockedView').classList.remove('hidden');
      return;
    }

    await setupMainView(tabId);
  }

  init();
})();

</script>
</body>
</html>
