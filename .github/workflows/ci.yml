name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check (all shipped JS)
        run: |
          node --check src/background/service-worker.js
          node --check src/content/main-world.js
          node --check src/content/content.js
          node --check src/content/library-core.js
          node --check src/content/library.js
          node --check src/popup/popup.js

      - name: Install test dependencies (puppeteer-core, no Chromium download)
        run: npm install --no-fund --no-audit

      - name: Unit + regression tests (auto-discovered)
        run: node test/run-all.mjs

      - name: Library browser integration test (system Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node test/browser/library-browser.test.mjs
