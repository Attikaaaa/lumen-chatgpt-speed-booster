name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (all JS)
        run: |
          node --check src/background/service-worker.js
          node --check src/content/main-world.js
          node --check src/content/content.js
          node --check src/popup/popup.js

      - name: Manifest integrity audit
        run: node test/manifest.test.mjs

      - name: DNR initiator-scope audit
        run: node test/dnr-scope.test.mjs

      - name: Pagination regression test
        run: node test/pagination.test.mjs
